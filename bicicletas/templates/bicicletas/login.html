{% extends "base.html" %}
{% load static %}

{% block title %}Iniciar sesión | Veloce{% endblock %}

{% block content %}
<div class="login-hero-section">
    <video class="video-bg" autoplay loop muted playsinline>
        <source src="{% static 'videos/login-bg.mp4' %}" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="container position-relative" style="z-index: 3;">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg bg-dark text-white border-secondary p-4 rounded-3 login-card-animate">
                    <div class="card-body p-2">
                        <h3 class="card-title text-center mb-4 text-uppercase fw-bold brand-green-text" style="letter-spacing: -0.02em;">Iniciar sesión</h3>

                        {% if form.errors %}
                            <div class="alert alert-danger">
                                Usuario o contraseña incorrectos.
                            </div>
                        {% endif %}

                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="id_username" class="form-label text-light">Usuario</label>
                                <input type="text" name="username" id="id_username"
                                       class="form-control bg-secondary text-white border-0" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="id_password" class="form-label text-light">Contraseña</label>
                                <input type="password" name="password" id="id_password"
                                       class="form-control bg-secondary text-white border-0" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-3">
                                Entrar
                            </button>
                        </form>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a href="{% url 'inicio' %}" class="text-decoration-none text-light opacity-75 back-link">
                        ← Volver al inicio
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .brand-green-text {
        color: #a3e635 !important;
    }

    @keyframes bikeSlideLeft {
        0% {
            opacity: 0;
            transform: translateX(-50px);
        }
        100% {
            opacity: 1;
            transform: translateX(0);
        }
    }

    .login-card-animate {
        animation: bikeSlideLeft 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .login-hero-section {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: -56px;
    }

    .video-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        pointer-events: none;
    }

    .video-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.75);
        z-index: 2;
    }

    .form-control:focus {
        border-color: #a3e635 !important;
        box-shadow: 0 0 0 0.25rem rgba(163, 230, 53, 0.25) !important;
    }

    .btn-success {
        background-color: #a3e635 !important;
        border-color: #a3e635 !important;
        color: #09090b !important;
        transition: all 0.2s ease-in-out;
    }
    .btn-success:hover {
        background-color: #bef264 !important;
        border-color: #bef264 !important;
        color: #09090b !important;
        transform: translateY(-2px);
    }

    .back-link {
        transition: color 0.2s ease-in-out;
    }
    .back-link:hover {
        color: #a3e635 !important;
    }
</style>
{% endblock %}
